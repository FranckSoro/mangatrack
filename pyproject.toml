[project]
name = "mangatrack"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "Django==6.0.4",
    "asgiref==3.11.1",
    "boto3==1.43.3",
    "botocore==1.43.3",
    "django-browser-reload==1.21.0",
    "django-environ==0.13.0",
    "django-storages==1.14.6",
    "django-tailwind==4.4.2",
    "jmespath==1.1.0",
    "pillow==12.2.0",
    "psycopg2-binary",
    "python-slugify==8.0.4",
    "s3transfer==0.17.0",
    "sqlparse==0.5.5",
    "urllib3==2.6.3",
    "whitenoise==6.12.0",
    "tzdata==2026.2",
]

[project.scripts]
app = "config.wsgi:application"

[tool.vercel]
root_directory = "src"          # ← Vercel cherche manage.py ici

[tool.vercel.scripts]
build = "python ../build.py"    # ← build.py reste à la racine