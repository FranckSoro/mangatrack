{% extends 'base.html' %}

{% block content %}
<div class="flex items-center justify-center min-h-screen bg-base-200 p-4">
  <div class="card w-full max-w-md bg-base-100 shadow-xl">
    <div class="card-body">
      <h2 class="card-title text-2xl font-bold text-center mb-4">Connexion</h2>

      <form method="post">
        {% csrf_token %}

        <div class="form-control">
          <label class="label">
            <span class="label-text">Nom d'utilisateur</span>
          </label>
          <div class="relative">
            <input
              type="text"
              name="username"
              class="input input-bordered w-full pl-12"
              required
              autofocus
            >
            <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-base-content/30" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
            </svg>
          </div>
        </div>

        <div class="form-control relative">
          <label class="label">
            <span class="label-text">Mot de passe</span>
          </label>
          <div class="relative">
            <input
              type="password"
              name="password"
              class="input input-bordered w-full pl-12 pr-12"
              required
              id="password-input"
            >
            <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-base-content/30" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
            </svg>
            <button
              type="button"
              class="absolute right-4 top-1/2 -translate-y-1/2 text-base-content/50 hover:text-base-content transition-colors"
              onclick="togglePassword('password-input', this)"
              aria-label="Afficher/masquer le mot de passe"
            >
              <svg class="w-5 h-5 eye-open" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
              </svg>
              <svg class="w-5 h-5 eye-closed hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path>
              </svg>
            </button>
          </div>
        </div>

        {% if form.errors %}
        <div class="alert alert-error mt-4">
          <span>Nom d'utilisateur ou mot de passe incorrect.</span>
        </div>
        {% endif %}

        <div class="form-control mt-6">
          <button type="submit" class="btn btn-primary">Se connecter</button>
        </div>

        <div class="text-center mt-4">
          <a href="{% url 'tracker:password_reset' %}" class="link link-primary text-sm">
            Mot de passe oublié ?
          </a>
        </div>
      </form>

      <div class="divider"></div>

      <p class="text-center">
        Pas encore de compte ?
        <a href="{% url 'tracker:register' %}" class="link link-primary">S'inscrire</a>
      </p>
    </div>
  </div>
</div>

<script>
function togglePassword(inputId, button) {
  const input = document.getElementById(inputId);
  const eyeOpen = button.querySelector('.eye-open');
  const eyeClosed = button.querySelector('.eye-closed');

  if (input.type === 'password') {
    input.type = 'text';
    eyeOpen.classList.add('hidden');
    eyeClosed.classList.remove('hidden');
  } else {
    input.type = 'password';
    eyeOpen.classList.remove('hidden');
    eyeClosed.classList.add('hidden');
  }
}
</script>
{% endblock %}
