{% extends 'base.html' %}

{% block content %}
<div class="flex items-center justify-center min-h-screen bg-base-200">
  <div class="card w-96 bg-base-100 shadow-xl">
    <div class="card-body">
      <h2 class="card-title text-2xl font-bold text-center mb-4">Connexion</h2>

      <form method="post">
        {% csrf_token %}

        <div class="form-control">
          <label class="label">
            <span class="label-text">Nom d'utilisateur</span>
          </label>
          <input
            type="text"
            name="username"
            class="input input-bordered"
            required
            autofocus
          >
        </div>

        <div class="form-control">
          <label class="label">
            <span class="label-text">Mot de passe</span>
          </label>
          <input
            type="password"
            name="password"
            class="input input-bordered"
            required
          >
        </div>

        {% if form.errors %}
        <div class="alert alert-error mt-4">
          <span>Nom d'utilisateur ou mot de passe incorrect.</span>
        </div>
        {% endif %}

        <div class="form-control mt-6">
          <button type="submit" class="btn btn-primary">Se connecter</button>
        </div>

        <div class="text-center mt-4">
          <a href="{% url 'tracker:password_reset' %}" class="link link-primary text-sm">
            Mot de passe oublié ?
          </a>
        </div>
      </form>

      <div class="divider"></div>

      <p class="text-center">
        Pas encore de compte ?
        <a href="{% url 'tracker:register' %}" class="link link-primary">S'inscrire</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
