<div class="card-body">
    <div class="flex items-center justify-between mb-4">
        <h3 class="card-title text-xl flex items-center gap-2">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            Historique de lecture
        </h3>
        <a href="{% url 'tracker:reading_history' user_series.series.slug %}" class="btn btn-sm btn-ghost gap-1">
            Voir tout
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
            </svg>
        </a>
    </div>

    <div class="space-y-3">
        {% for entry in history %}
        <div class="flex items-center justify-between p-3 rounded-xl bg-base-200/50 hover:bg-base-200 transition-colors group">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-gradient-to-br from-primary to-secondary flex items-center justify-center text-white font-bold shadow-sm">
                    {{ entry.chapter_number }}
                </div>
                <div>
                    <p class="font-medium">Chapitre {{ entry.chapter_number }}</p>
                    <p class="text-sm text-base-content/70">{{ entry.read_at|date:"d/m/Y à H:i" }}</p>
                </div>
            </div>
            <a href="{% url 'tracker:delete_reading_entry' user_series.series.slug entry.id %}" class="btn btn-xs btn-ghost text-error hover:bg-error/10 opacity-0 group-hover:opacity-100 transition-opacity" aria-label="Supprimer ce chapitre">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                </svg>
            </a>
        </div>
        {% empty %}
        <div class="text-center py-8">
            <svg class="w-16 h-16 mx-auto text-base-content/20 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <p class="text-base-content/70">Aucun chapitre lu pour le moment</p>
        </div>
        {% endfor %}
    </div>
</div>
